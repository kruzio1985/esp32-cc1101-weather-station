; PlatformIO Project Configuration
; 868 MHz Weather Station Raw Sniffer (ESP32-S3 lub ESP32 WROOM + CC1101)
;
; Domyślnie budowany jest [env:esp32s3]. Aby zbudować dla klasycznego
; ESP32 WROOM (4 MB, bez PSRAM):  pio run -e esp32-wroom
;                                 pio run -e esp32-wroom -t upload

[platformio]
default_envs = esp32s3

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8

; ----- ESP32-S3 DevKitC-1 (8 MB flash) -----
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.flash_mode = dio
board_build.mcu = esp32s3
upload_port = COM12
monitor_port = COM12

; ----- ESP32 WROOM-32 (4 MB flash, bez PSRAM) -----
; Piny CC1101 są inne niż na S3 — patrz README (sekcja „Sprzęt i podłączenie").
[env:esp32-wroom]
board = esp32dev
board_build.flash_mode = dio
; min_spiffs.csv daje dwie partycje aplikacji (app0/app1 po 1,875 MB) + otadata,
; czyli wspiera OTA (aktualizacja firmware przez WWW, bez USB i przycisku BOOT).
board_build.partitions = min_spiffs.csv
build_flags =
    -DBOARD_WROOM
upload_port = COM8
monitor_port = COM8
upload_speed = 460800
; Ta plytka nie robi autoresetu niezawodnie - duza liczba prob daje czas
; na przytrzymanie przycisku BOOT podczas wgrywania.
upload_flags =
    --before
    no-reset
    --connect-attempts
    150