; PlatformIO Project Configuration
; 868 MHz Weather Station Receiver - ESP32-S3 or classic ESP32 WROOM + CC1101
;
; Default build target is [env:esp32s3]. To build for a classic
; ESP32 WROOM-32 (4 MB flash, no PSRAM):
;     pio run -e esp32-wroom
;     pio run -e esp32-wroom -t upload
;
; NOTE: this file is intentionally ASCII-only and contains no machine-specific
; settings (no upload_port), so it builds and uploads on any PC. The USB port
; is auto-detected by PlatformIO. If auto-detection picks the wrong port, pass
; it explicitly:  pio run -e esp32-wroom -t upload --upload-port COM5
; See README.md ("Build and flash") for the manual-BOOT procedure that some
; WROOM boards need, and for updating the firmware over the network (OTA).

[platformio]
default_envs = esp32s3

[env]
; Platform pinned to the pioarduino community build of espressif32 55.03.312,
; which ships Arduino-ESP32 core 3.3.12. The official PlatformIO registry
; platform for ESP32 (espressif32@6.x) still provides Arduino core 2.x, which
; is too old for this firmware (it lacks the current task-WDT API), so the URL
; form below is required. It downloads automatically on the first build.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8
; Dwa odbiorniki w jednym projekcie:
;   src/main.cpp        - ESP32 WROOM/S3 + CC1101 (dziala dzisiaj)
;   src/main_sx1262.cpp - ESP32-S2 Mini + SX1262 (nowy, wgrywany po podmianie sprzetu)
; Kazde srodowisko buduje tylko swoj plik glowny; dekodery (vevor.cpp, decoders.h)
; sa wspolne, wiec dane podawane stacji glownej sa identyczne.
build_src_filter = +<*> -<main_sx1262.cpp>

; ----- ESP32-S3 DevKitC-1 (8 MB flash) -----
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.flash_mode = dio

; ----- ESP32 WROOM-32 (4 MB flash, no PSRAM) -----
; CC1101 pins differ from the S3 - see README ("Hardware & wiring").
; min_spiffs.csv provides two app partitions (app0/app1, 1.875 MB each) plus
; otadata, so over-the-air updates (OTA) over the network are possible.
[env:esp32-wroom]
board = esp32dev
board_build.flash_mode = dio
board_build.partitions = min_spiffs.csv
build_flags =
    -DBOARD_WROOM

; ----- ESP32-S2 Mini + SX1262 (IPEX) - odbiornik zamiast CC1101 -----
; Modul: DX-LR30-900M22S (SX1262, 850-930 MHz, SPI, kwarc 32 MHz, IPEX).
; Piny i parametry radiowe: patrz naglowek src/main_sx1262.cpp.
; Budowa: pio run -e esp32-s2-sx1262      Wgranie: ... -t upload
[env:esp32-s2-sx1262]
board = lolin_s2_mini
board_build.flash_mode = dio
build_src_filter = +<*> -<main.cpp>
lib_deps =
    jgromes/RadioLib@^7.0.0
build_flags =
    -DBOARD_S2_SX1262